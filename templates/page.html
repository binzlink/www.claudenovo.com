<!DOCTYPE html>
<html lang="{{lang}}" dir="{{dir}}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{title}}</title>
    <meta name="description" content="{{description}}">
    <meta name="keywords" content="{{keywords}}">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="{{canonical}}">
{{hreflang_links}}
    <link rel="icon" href="https://www.claudenovo.com/novobyte_icon.jpg">
    <style>
        :root {
            --footer-bg: #0f1419;
            --footer-surface: #1a222c;
            --footer-text: #c5ced8;
            --footer-muted: #7a8794;
            --footer-accent: #fa8231;
            --footer-border: #2a3540;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
            color: #14142b;
            background: #ffffff;
        }

        #site-footer {
            background:
                radial-gradient(ellipse 80% 50% at 10% 0%, rgba(250, 130, 49, 0.08), transparent 50%),
                radial-gradient(ellipse 60% 40% at 90% 100%, rgba(45, 140, 200, 0.06), transparent 45%),
                var(--footer-bg);
            color: var(--footer-text);
            padding: 3.5rem 1.25rem 2rem;
            border-top: 1px solid var(--footer-border);
        }

        .footer-inner {
            max-width: 1120px;
            margin: 0 auto;
        }

        .footer-intro {
            margin-bottom: 2.5rem;
            max-width: 42rem;
        }

        .footer-intro h2 {
            margin: 0 0 0.6rem;
            font-size: 1.35rem;
            font-weight: 650;
            letter-spacing: -0.02em;
            color: #f2f5f8;
        }

        .footer-intro p {
            margin: 0;
            font-size: 0.95rem;
            line-height: 1.55;
            color: var(--footer-muted);
        }

        .footer-categories {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1.75rem 1.5rem;
        }

        .footer-cat h3 {
            margin: 0 0 0.85rem;
            padding-bottom: 0.5rem;
            font-size: 0.78rem;
            font-weight: 650;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--footer-accent);
            border-bottom: 1px solid var(--footer-border);
        }

        .footer-cat ul {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
        }

        .footer-cat a {
            color: var(--footer-text);
            text-decoration: none;
            font-size: 0.875rem;
            line-height: 1.4;
            transition: color 0.15s ease;
        }

        .footer-cat a:hover,
        .footer-cat a:focus-visible {
            color: #ffffff;
            text-decoration: underline;
            text-underline-offset: 3px;
        }

        .footer-langs {
            margin-top: 2rem;
            padding-top: 1.25rem;
            border-top: 1px solid var(--footer-border);
        }

        .footer-langs-label {
            display: block;
            margin-bottom: 0.65rem;
            font-size: 0.78rem;
            font-weight: 650;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--footer-accent);
        }

        .footer-langs-list {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem 0.85rem;
        }

        .footer-langs-list a {
            color: var(--footer-text);
            text-decoration: none;
            font-size: 0.85rem;
        }

        .footer-langs-list a:hover,
        .footer-langs-list a:focus-visible {
            color: #ffffff;
            text-decoration: underline;
            text-underline-offset: 3px;
        }

        .footer-langs-list a[aria-current="page"] {
            color: #ffffff;
            font-weight: 600;
        }

        .footer-bottom {
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--footer-border);
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem 1.5rem;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            color: var(--footer-muted);
        }

        .footer-brand {
            color: #f2f5f8;
            font-weight: 600;
        }

        @media (max-width: 600px) {
            #site-footer {
                padding: 2.5rem 1rem 1.5rem;
            }

            .footer-categories {
                grid-template-columns: repeat(2, 1fr);
                gap: 1.5rem 1rem;
            }
        }
    </style>
</head>
<body>
<div id="tn-app"></div>
<script
  src="https://tn.platfone.com/tn.js"
  id="tn-script"
  data-name="ClaudeNovo"
  data-logo="https://www.claudenovo.com/novobyte_icon.jpg"
  data-background-color="#ffffff"
  data-text-color="#14142b"
  data-button-color="#fa8231">
</script>

<footer id="site-footer">
    <div class="footer-inner">
        <div class="footer-intro">
            <h2>{{footer_heading}}</h2>
            <p>{{footer_intro}}</p>
        </div>

        <nav class="footer-categories" aria-label="{{footer_nav_label}}">
            {{footer_categories}}
        </nav>

        <nav class="footer-langs" aria-label="{{languages_label}}">
            <span class="footer-langs-label">{{languages_label}}</span>
            <ul class="footer-langs-list">
                {{language_links}}
            </ul>
        </nav>

        <div class="footer-bottom">
            <span class="footer-brand">ClaudeNovo</span>
            <span>&copy; <span id="footer-year">2026</span> ClaudeNovo. {{footer_tagline}}</span>
        </div>
    </div>
</footer>
<script>
    document.getElementById("footer-year").textContent = String(new Date().getFullYear());
</script>

  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-MV5LGGJ7LH');
</script>
</body>
</html>
